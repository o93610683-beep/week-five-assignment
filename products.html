<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="assets/css/style.css">

            <article class="product-card">

                <p>Price: ₦25,000</p>
            </article>

            <article class="product-card">
                <div class="product-image"><img src="assets/image/headset.103.jpg" alt="" width="100px"></div>
                <h2>Product Three</h2>
                <p>Price: ₦35,000</p>
            </article>

        </section>

        <p class="back-link"><a href="index.html">Back to Home</a></p>
