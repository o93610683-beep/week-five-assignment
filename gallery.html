<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Page</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="gallery-container">

        <header class="navbar">
            <div class="logo">My Logo</div>

            <nav>
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="dashboard.html">Dashboard</a>
            </nav>

            <button class="menu-button" type="button"
                onclick="document.querySelector('.navbar nav').classList.toggle('show-menu')">
                ☰
            </button>
        </header>

        <div class="gallery-layout">

            <section class="form-box">
                <h2>Contact Form</h2>

                <form>
                    <label for="name">Name:</label>
                    <input type="text" id="name"
                        placeholder="Enter your name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email"
                        placeholder="Enter your email" required>

                    <label for="message">Message:</label>
                    <textarea id="message"
                        placeholder="Write your message"></textarea>

                    <button type="submit">Submit</button>
                </form>
            </section>

            <section class="background-box">
                <div class="background-text">
                    <h2>Welcome to My Gallery</h2>
                    <p>Beautiful images and interesting stories.</p>
                </div>
            </section>

        </div>

        <p class="back-link"><a href="index.html">Back to Home</a></p>

    </div>

</body>
</html>
